
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="assets/traveland/css/nice-select.css">
<style>
.container { width: 300px; border: 1px solid red; }
        .nice-select {
            width: 100% !important;
            white-space: normal !important;
            height: auto !important;
            line-height: normal !important;
            padding-top: 10px;
            padding-bottom: 10px;
            max-width: 100%;
        }
        .nice-select .current {
            white-space: normal !important;
            display: inline-block;
            padding-right: 15px;
            word-wrap: break-word;
        }
        .nice-select .list {
            width: 100% !important;
            max-width: 100vw;
            box-sizing: border-box;
        }
        .nice-select .option {
            white-space: normal !important;
            line-height: 1.3 !important;
            padding-top: 8px !important;
            padding-bottom: 8px !important;
            min-height: auto !important;
            word-wrap: break-word;
        }
</style>
</head>
<body>
<div class="container">
    <div class="nice-select wide" tabindex="0">
        <span class="current">PELAYANAN ADMINISTRASI & SURAT KESEHATAN (Non BPJS)</span>
        <ul class="list">
            <li class="option selected">PELAYANAN ADMINISTRASI & SURAT KESEHATAN (Non BPJS)</li>
        </ul>
    </div>
</div>
</body>
</html>
